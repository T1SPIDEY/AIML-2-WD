<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Name</title>
</head>
<body>
    <script>
        let name="Devansh";
        let last=new String();
        last ="Agarwal";
        document.write(name+" "+last);
        document.write("<br>");
        document.write(name.length);
        document.write("<br>");
        document.write(name.toUpperCase());
        document.write("<br>");
        document.write(name.toLowerCase());
        document.write("<br>");
        document.write(name.charAt(3));
        document.write("<br>");
        document.write(name.indexOf("v"));
        document.write("<br>");
        document.write(name.lastIndexOf("a"));
        document.write("<br>");
        document.write(name.slice(2,5));
        document.write("<br>");
        document.write(name.replace("Devansh","Dev"));
        document.write("<br>");
        
  
    </script>
</body>
</html>
