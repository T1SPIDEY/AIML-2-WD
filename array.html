<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr=[10,20,30,40,50];
        documnet.write(arr+"<br>");
        document.write(arr.length+"<br>");
        document.write(arr[2]+"<br>");
        arr.push(60);   // push() adds a new element to the END of the array
        document.write(arr+"<br>");
        arr.pop();// pop() removes the LAST element from the array
        document.write(arr+"<br>");
        arr.shift();// shift() removes the FIRST element from the array
        document.write(arr+"<br>");
        arr.unshift(5);// unshift() adds a new element to the BEGINNING of the array
        document.write(arr+"<br>");
    </script>
    
</body>
</html>
